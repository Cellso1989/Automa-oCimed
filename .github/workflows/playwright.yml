name: Playwright Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright
        run: npx playwright install --with-deps

      - name: Criar arquivo de ambiente
        env:
          SF_BASE_URL: ${{ secrets.SF_BASE_URL }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
          SF_TOTP_SECRET: ${{ secrets.SF_TOTP_SECRET }}
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          cat > env.json <<EOF
          {
            "sfBaseUrl": "$SF_BASE_URL",
            "sfUsername": "$SF_USERNAME",
            "sfPassword": "$SF_PASSWORD",
            "sfSecurityToken": "$SF_SECURITY_TOKEN",
            "sfTotpSecret": "$SF_TOTP_SECRET",
            "JIRA_SITE": "$JIRA_SITE",
            "JIRA_PROJECT_KEY": "$JIRA_PROJECT_KEY",
            "JIRA_EMAIL": "$JIRA_EMAIL",
            "JIRA_API_TOKEN": "$JIRA_API_TOKEN"
          }
          EOF

      - name: Executar testes
        # CT 12 (Hospitalar): limitação conhecida, sem processo de aprovação
        # ativo nesta org — não é algo que massa/automação resolva.
        # CT 14 (Pedido via Visita/Organizer): trava consistentemente no CI
        # esperando o botão "Salvar" da Visita, mas passa normal localmente
        # (mesmo headless) — causa raiz ainda não identificada, fora por
        # enquanto até investigarmos com evidência real da falha.
        run: npx playwright test --grep-invert "aprova um Lead Hospitalar e leva até Convertido|cria um Pedido a partir de uma Visita, no Organizer, como Sales Rep"

      - name: Salvar screenshots de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          # O projeto usa reporter "list" (sem HTML report) e cada "project"
          # salva screenshots na própria pasta do tema (playwright.config.js)
          # — não em playwright-report/, que nunca chega a existir.
          path: tests/*/screenshots/
          retention-days: 7
          if-no-files-found: ignore
